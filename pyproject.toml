[project]
name = "cinepyle"
version = "0.1.0"
description = "Korean cinema news digest sender for Telegram"
requires-python = "~=3.14.0"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "ty>=0.0.17",
]


[project.scripts]
cinepyle = "cinepyle.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinepyle"]
